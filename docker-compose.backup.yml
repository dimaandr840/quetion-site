# Оверлей резервного копирования: pgBackRest + непрерывный архив WAL + PITR.
#
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
#
# Делает две вещи:
#   1. пересобирает postgres из ./postgres (тот же PostgreSQL 16 + pgbackrest) и
#      включает архивацию WAL;
#   2. добавляет сайдкар pgbackrest: расписание бэкапов, проверка восстановления,
#      контроль свежести и алерты.
#
# ВНИМАНИЕ: оверлей не опционален в бою. С archive_mode=on база начинает
# копить WAL, если архивация не работает, и без сайдкара с алертами это
# заканчивается заполнением диска. Запускайте оба файла вместе или ни один.

x-pgbackrest-env: &pgbackrest-env
  PGBACKREST_STANZA: devprep
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET обязателен}
  # Cloudflare R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT обязателен}
  # R2 принимает только region=auto; для других S3 укажите реальный регион.
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-auto}
  PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY обязателен}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_SECRET_KEY:?BACKUP_S3_SECRET_KEY обязателен}
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS обязателен}
  PGBACKREST_PG1_USER: ${POSTGRES_USER:-devprep}
  PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-devprep}

services:
  postgres:
    build:
      context: ./postgres
    image: devprep-postgres-pgbackrest:16
    environment:
      <<: *pgbackrest-env
    command:
      - postgres
      # Минимальный wal_level для архива и PITR.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Сама база вызывает pgbackrest из своего контейнера; благодаря archive-async
      # она не ждёт сети и не тормозит транзакции.
      - -c
      - archive_command=pgbackrest --stanza=devprep archive-push %p
      # Потолок RPO на тихой базе: WAL закрывается не реже раза в минуту,
      # даже если записей мало.
      - -c
      - archive_timeout=60
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Сокет шарится с сайдкаром: pgBackRest подключается к БД локально.
      - postgres-socket:/var/run/postgresql
      - pgbackrest-spool:/var/spool/pgbackrest
      - pgbackrest-log:/var/log/pgbackrest
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

  pgbackrest:
    build:
      context: ./postgres
    image: devprep-postgres-pgbackrest:16
    restart: unless-stopped
    # Тот же uid, что у PostgreSQL: иначе нет доступа к PGDATA и сокету.
    user: postgres
    # bash явно: файлы из git могут приехать без бита исполнения.
    entrypoint: ["bash", "/opt/backup/pgbackrest-scheduler.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *pgbackrest-env
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      # Расписание.
      BACKUP_TICK_SECONDS: ${BACKUP_TICK_SECONDS:-86400}
      BACKUP_INITIAL_DELAY: ${BACKUP_INITIAL_DELAY:-60}
      BACKUP_FULL_INTERVAL_DAYS: ${BACKUP_FULL_INTERVAL_DAYS:-7}
      BACKUP_VERIFY_INTERVAL_DAYS: ${BACKUP_VERIFY_INTERVAL_DAYS:-7}
      BACKUP_LOGICAL_INTERVAL_DAYS: ${BACKUP_LOGICAL_INTERVAL_DAYS:-7}
      BACKUP_LOGICAL_KEEP: ${BACKUP_LOGICAL_KEEP:-4}
      # Пороги алертов.
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
      BACKUP_WAL_MAX_AGE_MINUTES: ${BACKUP_WAL_MAX_AGE_MINUTES:-15}
      BACKUP_PGWAL_MAX_MB: ${BACKUP_PGWAL_MAX_MB:-4096}
      BACKUP_ALERT_WEBHOOK: ${BACKUP_ALERT_WEBHOOK:-}
      # Минимально ожидаемые объёмы данных при проверке восстановления.
      VERIFY_MIN_QUESTION: ${VERIFY_MIN_QUESTION:-1}
      VERIFY_MAX_DATA_AGE_DAYS: ${VERIFY_MAX_DATA_AGE_DAYS:-0}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
      - pgbackrest-spool:/var/spool/pgbackrest
      - pgbackrest-log:/var/log/pgbackrest
      - backup-state:/var/lib/backup-state
      - backup-verify:/var/tmp/verify
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./scripts:/opt/backup:ro
      # Логические дампы лежат на хосте, чтобы их можно было увезти вручную.
      # Каталог должен быть записываем для uid 999: sudo chown 999:999 backups
      - ./backups:/backups
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-socket:
  pgbackrest-spool:
  pgbackrest-log:
  backup-state:
  backup-verify:
