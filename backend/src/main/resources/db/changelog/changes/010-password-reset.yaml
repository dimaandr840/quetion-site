databaseChangeLog:
  - changeSet:
      id: 010-password-reset-token-table
      author: devprep
      comment: >-
        Одноразовые коды восстановления доступа, которые уходят письмом.
        В таблице только BCrypt-хеш кода: по дампу базы сам код не восстановить.
        Счётчик attempts гасит перебор, expires_at ограничивает окно жизни кода.
      changes:
        - createTable:
            tableName: password_reset_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_user
                    references: app_user(id)
                    deleteCascade: true
              - column:
                  name: code_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: requested_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: requested_ip
                  type: VARCHAR(64)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 010-password-reset-token-index
      author: devprep
      comment: >-
        Активный код ищется по пользователю и признаку «ещё не использован» при каждой
        попытке ввода — без индекса это полный скан таблицы.
      changes:
        - createIndex:
            indexName: idx_password_reset_user
            tableName: password_reset_token
            columns:
              - column:
                  name: user_id
              - column:
                  name: used_at

  - changeSet:
      id: 010-drop-backup-codes
      author: devprep
      comment: >-
        Резервные коды больше не используются: их роль (восстановление доступа при
        потере телефона или пароля) перешла к одноразовому коду из письма.
        В таблице лежали только хеши, поэтому удаление ничего не ломает.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: user_backup_code
      changes:
        - dropTable:
            tableName: user_backup_code
