databaseChangeLog:
  - changeSet:
      id: 002-auth-schema
      author: devprep
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_user
              - column:
                  name: email
                  type: varchar(256)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_app_user_email
              - column:
                  name: password_hash
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false

        - createTable:
            tableName: app_user_role
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_app_user_role_user
                    references: app_user(id)
                    deleteCascade: true
              - column:
                  name: role
                  type: varchar(32)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: app_user_role
            columnNames: user_id, role
            constraintName: pk_app_user_role
