databaseChangeLog:
  - changeSet:
      id: 009-backup-code-table
      author: devprep
      comment: >-
        Резервные коды второго фактора. Нужны, чтобы потеря телефона не
        превращалась в потерю доступа к админке: код одноразовый, хранится
        только BCrypt-хеш, поэтому дамп базы кодов не выдаёт.
      changes:
        - createTable:
            tableName: user_backup_code
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_backup_code_user
                    references: app_user(id)
                    deleteCascade: true
              - column:
                  name: code_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 009-backup-code-index
      author: devprep
      comment: Поиск неиспользованных кодов пользователя на шаге входа.
      changes:
        - createIndex:
            tableName: user_backup_code
            indexName: idx_backup_code_user
            columns:
              - column:
                  name: user_id
              - column:
                  name: used_at
