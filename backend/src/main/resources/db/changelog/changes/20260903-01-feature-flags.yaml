databaseChangeLog:
  - changeSet:
      id: 20260903-01-feature-flags
      author: devprep
      comment: >-
        Рантайм-флаги. До этого флаги были build-arg'ами Next.js, то есть любое
        переключение требовало пересборки образа и деплоя.
      changes:
        - createTable:
            tableName: feature_flags
            columns:
              - column:
                  name: flag_key
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_feature_flags
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: rollout_percentage
                  type: INT
                  defaultValueNumeric: 100
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(200)
  - changeSet:
      id: 20260903-02-feature-flags-rollout-range
      author: devprep
      comment: >-
        Процент раскатки проверяется и в коде, но база — последняя линия обороны:
        значение можно поменять руками через psql.
      changes:
        - sql:
            sql: >-
              ALTER TABLE feature_flags ADD CONSTRAINT ck_feature_flags_rollout
              CHECK (rollout_percentage BETWEEN 0 AND 100)
            rollback: ALTER TABLE feature_flags DROP CONSTRAINT ck_feature_flags_rollout
