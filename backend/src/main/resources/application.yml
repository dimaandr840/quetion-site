server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: devprep-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:devprep}
    username: ${POSTGRES_USER:devprep}
    password: ${POSTGRES_PASSWORD:devprep}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: devprep-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Первый барьер для загрузки: Tomcat обрывает запрос, не доводя файл до кода.
      # Держать согласованным с devprep.media.max-file-size и client_max_body_size в nginx.
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}
  threads:
    virtual:
      enabled: true
  # SMTP нужен только для писем с кодом восстановления доступа.
  # Если SMTP_HOST пуст, сервис запускается как обычно, но сброс пароля
  # по почте не работает — статус виден в админке (/api/admin/status).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

devprep:
  seed:
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  media:
    # Хранилище картинок. Выключено по умолчанию: без ключей R2 сервис поднимается
    # как раньше, просто загрузка отвечает 503. См. docs/media.md.
    enabled: ${MEDIA_ENABLED:false}
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:auto}
    # Домен, с которого картинки отдаются читателям: r2.dev, свой поддомен или CDN.
    # Он же должен быть в images.remotePatterns и в img-src CSP на фронтенде.
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    key-prefix: ${MEDIA_KEY_PREFIX:questions}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
    max-dimension: ${MEDIA_MAX_DIMENSION:1600}
  jwt:
    # Обязательно задать через переменную окружения. Дефолта в репозитории нет намеренно.
    secret: ${JWT_SECRET}
    issuer: devprep
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  security:
    # На время разработки авторизацию можно отключить: /api/admin/** станет публичным.
    # В production всегда true.
    auth-enabled: ${AUTH_ENABLED:true}
    cookie:
      # Secure=true требует HTTPS. Для локальной разработки по http выключается
      # через COOKIE_SECURE=false (см. application-dev.yml / docker-compose.dev.yml).
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Strict}
      domain: ${COOKIE_DOMAIN:}
    lockout:
      enabled: ${LOCKOUT_ENABLED:true}
      max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${LOCKOUT_DURATION:PT15M}
    rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures-per-ip: ${LOGIN_RATE_LIMIT_MAX:20}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT10M}
    totp:
      required-for-admins: ${TOTP_REQUIRED_FOR_ADMINS:true}
      # Base64-ключ (16/24/32 байта): openssl rand -base64 32.
      # Пустой — TOTP-секреты хранятся в БД открыто (только для разработки).
      encryption-key: ${TOTP_ENC_KEY:}
      issuer: DevPrep
    # Самостоятельное восстановление доступа по почте (замена резервных кодов).
    # Адрес получателя не настраивается: код уходит только на адрес учётки
    # и только если он совпал с введённым; в ответе API и в UI он всегда замаскирован.
    password-reset:
      enabled: ${PASSWORD_RESET_ENABLED:true}
      ttl: ${PASSWORD_RESET_TTL:PT15M}
      cooldown: ${PASSWORD_RESET_COOLDOWN:PT1M}
      max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
      # true стирает привязку аутентификатора при успешном сбросе — это замена
      # резервным кодам в сценарии «потерял телефон», но делает почту
      # единственным фактором восстановления.
      reset-totp: ${PASSWORD_RESET_RESET_TOTP:true}
      # Адрес в поле From. Пусто — письма не отправляются.
      mail-from: ${PASSWORD_RESET_MAIL_FROM:}
  search:
    enabled: ${MEILI_ENABLED:false}
    host: ${MEILI_HOST:http://localhost:7700}
    api-key: ${MEILI_MASTER_KEY:}
    index: questions
    reindex-on-startup: true
    # Meilisearch по умолчанию отдаёт не более 1000 результатов (maxTotalHits).
    # Глубокие страницы за этой границей обслуживает Postgres: иначе индекс
    # молча отдаёт пустую страницу, и пагинация выглядит сломанной.
    max-total-hits: ${MEILI_MAX_TOTAL_HITS:1000}
    # Размер страницы поиска по умолчанию и потолок, выше которого запрос
    # обрезается (защита от size=100000 из строки запроса).
    page-size: ${SEARCH_PAGE_SIZE:20}
    max-page-size: ${SEARCH_MAX_PAGE_SIZE:50}
    # Период проверки живости индекса для гейджа devprep_search_up и админки.
    health-check-interval: ${SEARCH_HEALTH_INTERVAL:PT30S}
  flags:
    # Рантайм-флаги: таблица feature_flags + кэш в памяти. Значения меняются
    # без пересборки образов и без рестарта — в отличие от NEXT_PUBLIC_*,
    # которые вшиваются в бандл на этапе build.
    enabled: ${FLAGS_ENABLED:true}
    # TTL кэша. Горячий путь не должен ходить в БД на каждую проверку флага,
    # но и ждать минуты при раскатке не хочется: 15 секунд — компромисс.
    cache-ttl: ${FLAGS_CACHE_TTL:PT15S}
    # Значения, с которыми флаги создаются в БД при первом запуске и которые
    # используются, если БД недоступна (флаги не должны ронять запрос).
    defaults:
      auth-enabled: ${AUTH_ENABLED:true}
      search-index-enabled: ${MEILI_ENABLED:false}
      media-enabled: ${MEDIA_ENABLED:false}
      registration-enabled: ${REGISTRATION_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # Метрики Prometheus открываются только там, где есть закрытый контур
        # сбора: они рассказывают о внутренней структуре и нагрузке сервиса.
        # В docker-compose порт 8080 не публикуется наружу, а nginx отдаёт 404
        # на всё /actuator/, кроме /actuator/health — поэтому prometheus в списке
        # по умолчанию безопасен и доступен только из внутренней сети.
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Падение Meilisearch — не причина выводить контейнер из readiness:
    # поиск деградирует до ILIKE, и трафик надо продолжать обслуживать.
    # Статус виден в /actuator/health детально и в алертах по devprep_search_up.
    group:
      readiness:
        include: readinessState,db
  metrics:
    distribution:
      # Без гистограммы histogram_quantile считать не из чего: Micrometer по
      # умолчанию отдаёт только count/sum/max, и p95 в Prometheus невозможен.
      percentiles-histogram:
        http.server.requests: true
      # Границы вокруг SLO 500 мс — иначе ближайшие бакеты стоят так широко,
      # что оценка p95 гуляет на сотни миллисекунд.
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,800ms,1s,2s,5s
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      # 10% по умолчанию: полный семплинг на публичном трафике быстро забивает
      # диск Tempo. При разборе конкретного инцидента временно ставьте 1.0.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      # Трейсы уходят в Tempo напрямую. Если стек наблюдаемости не запущен,
      # экспортёр молча ретрайтит в фоне — запросы от этого не страдают.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

springdoc:
  # Схема API и Swagger UI выключены по умолчанию: публичная схема — это
  # готовая карта админских ручек для сканеров. На локальной машине
  # включается одним флагом SPRINGDOC_ENABLED=true.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api/openapi.json
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api/docs

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  exception-resolver-order: -2147483647

logging:
  level:
    com.devprep.api: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
