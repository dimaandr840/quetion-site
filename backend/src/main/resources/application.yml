server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: devprep-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:devprep}
    username: ${POSTGRES_USER:devprep}
    password: ${POSTGRES_PASSWORD:devprep}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: devprep-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Первый барьер для загрузки: Tomcat обрывает запрос, не доводя файл до кода.
      # Держать согласованным с devprep.media.max-file-size и client_max_body_size в nginx.
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}
  threads:
    virtual:
      enabled: true
  # SMTP нужен только для писем с кодом восстановления доступа.
  # Если SMTP_HOST пуст, сервис запускается как обычно, но сброс пароля
  # по почте не работает (в логах будет ошибка о ненастроенном SMTP).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

devprep:
  seed:
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  media:
    # Хранилище картинок. Выключено по умолчанию: без ключей R2 сервис поднимается
    # как раньше, просто загрузка отвечает 503. См. docs/media.md.
    enabled: ${MEDIA_ENABLED:false}
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:auto}
    # Домен, с которого картинки отдаются читателям: r2.dev, свой поддомен или CDN.
    # Он же должен быть в images.remotePatterns и в img-src CSP на фронтенде.
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    key-prefix: ${MEDIA_KEY_PREFIX:questions}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
    max-dimension: ${MEDIA_MAX_DIMENSION:1600}
  jwt:
    # Обязательно задать через переменную окружения. Дефолта в репозитории нет намеренно.
    secret: ${JWT_SECRET}
    issuer: devprep
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  security:
    # На время разработки авторизацию можно отключить: /api/admin/** станет публичным.
    # В production всегда true.
    auth-enabled: ${AUTH_ENABLED:true}
    cookie:
      # Secure=true требует HTTPS. Для локальной разработки по http выключается
      # через COOKIE_SECURE=false (см. application-dev.yml / docker-compose.dev.yml).
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Strict}
      domain: ${COOKIE_DOMAIN:}
    lockout:
      enabled: ${LOCKOUT_ENABLED:true}
      max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${LOCKOUT_DURATION:PT15M}
    rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures-per-ip: ${LOGIN_RATE_LIMIT_MAX:20}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT10M}
    totp:
      required-for-admins: ${TOTP_REQUIRED_FOR_ADMINS:true}
      # Base64-ключ (16/24/32 байта): openssl rand -base64 32.
      # Пустой — TOTP-секреты хранятся в БД открыто (только для разработки).
      encryption-key: ${TOTP_ENC_KEY:}
      issuer: DevPrep
    # Самостоятельное восстановление доступа по почте (замена резервных кодов).
    # Адрес получателя не настраивается: код уходит только на адрес учётки
    # и только если он совпал с введённым; в ответе API и в UI он всегда замаскирован.
    password-reset:
      enabled: ${PASSWORD_RESET_ENABLED:true}
      ttl: ${PASSWORD_RESET_TTL:PT15M}
      cooldown: ${PASSWORD_RESET_COOLDOWN:PT1M}
      max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
      # true стирает привязку аутентификатора при успешном сбросе — это замена
      # резервным кодам в сценарии «потерял телефон», но делает почту
      # единственным фактором восстановления.
      reset-totp: ${PASSWORD_RESET_RESET_TOTP:true}
      # Адрес в поле From. Пусто — письма не отправляются.
      mail-from: ${PASSWORD_RESET_MAIL_FROM:}
  search:
    enabled: ${MEILI_ENABLED:false}
    host: ${MEILI_HOST:http://localhost:7700}
    api-key: ${MEILI_MASTER_KEY:}
    index: questions
    reindex-on-startup: true

management:
  endpoints:
    web:
      exposure:
        # Метрики Prometheus открываются только там, где есть закрытый контур
        # сбора: они рассказывают о внутренней структуре и нагрузке сервиса.
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  # Схема API и Swagger UI выключены по умолчанию: публичная схема — это
  # готовая карта админских ручек для сканеров. На локальной машине
  # включается одним флагом SPRINGDOC_ENABLED=true.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api/openapi.json
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api/docs

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  exception-resolver-order: -2147483647

logging:
  level:
    com.devprep.api: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
