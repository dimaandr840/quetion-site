user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format privacy_access escape=json '{"timestamp":"$time_iso8601","service":"nginx","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time}';
    access_log /var/log/nginx/access.log privacy_access;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    map $request_id $devprep_span_id { "~^(?<sid>[0-9a-f]{16})" $sid; default "00000000deadbe01"; }
    map $http_traceparent $devprep_traceparent { "~^00-[0-9a-f]{32}-[0-9a-f]{16}-0[0-9a-f]$" $http_traceparent; default "00-$request_id-$devprep_span_id-01"; }
    map $host $devprep_csp { default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pub-026d691fc4174eae84975b10e44eadf5.r2.dev; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header traceparent $devprep_traceparent;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    upstream devprep_api { server api:8080; keepalive 16; }
    upstream devprep_web { server web:3000; keepalive 16; }

    server {
        listen 80;
        server_name _;
        limit_conn perip 32;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $devprep_csp always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=()" always;
        add_header X-Request-Id $request_id always;

        location ~ /\. { deny all; access_log off; log_not_found off; return 404; }
        location ~* \.(env|bak|old|sql|swp|ini|log|zip|tar|gz)$ { deny all; access_log off; return 404; }
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location /_next/static/ { proxy_pass http://devprep_web; add_header Cache-Control "public, max-age=31536000, immutable"; }
        location = /api/auth/login { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; }
        location = /api/auth/totp/verify { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; }
        location = /api/auth/register { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; }
        location = /api/auth/password { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; add_header Cache-Control "no-store" always; }
        location = /api/admin/media { limit_req zone=api burst=10 nodelay; client_max_body_size 6m; proxy_pass http://devprep_api; proxy_read_timeout 120s; add_header Cache-Control "no-store" always; }
        location /api/docs { return 404; }
        location = /api/openapi.json { return 404; }
        location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://devprep_api; add_header Cache-Control "no-store" always; }
        location = /api/actuator/health { proxy_pass http://devprep_api/actuator/health; access_log off; }
        location /actuator/ { return 404; }
        location /admin { proxy_pass http://devprep_web; proxy_buffering off; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; add_header Cache-Control "no-store" always; }
        location / { proxy_pass http://devprep_web; proxy_buffering off; }
    }
}
