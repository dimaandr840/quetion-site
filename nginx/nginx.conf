user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Структурный access-лог: promtail разбирает его тем же json-стейджем, что и
    # логи приложений, поэтому в Loki по одному request_id находятся сразу три
    # слоя — периметр, Next и Spring. escape=json обязателен: без него кавычки в
    # User-Agent ломают JSON и строка теряется целиком.
    log_format json_access escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"request_id":"$request_id",'
        '"trace_id":"$devprep_trace_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_access;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Глобальный лимит остаётся жёстким: обычный JSON апсерт вопроса в
    # два мегабайта умещается с запасом. Послабление только для загрузки
    # картинок — см. location = /api/admin/media.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/problem+json
        application/xml application/rss+xml application/atom+xml text/xml
        image/svg+xml font/woff2;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Отдельная, гораздо более узкая зона для входа: перебор пароля через HTTP
    # упирается в неё раньше, чем в блокировку учётки на бэкенде.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # --- Сквозная трассировка -------------------------------------------------
    #
    # $request_id — 32 hex-символа, ровно формат W3C trace-id, поэтому отдельный
    # генератор не нужен. span-id по спецификации 16 hex-символов: берём первую
    # половину request_id. Такой span в Tempo не существует как запись, он служит
    # только родителем для первого реального спана в Next или Spring — иначе
    # traceparent пришлось бы собирать в приложении и nginx выпадал бы из цепочки.
    map $request_id $devprep_span_id {
        "~^(?<sid>[0-9a-f]{16})" $sid;
        default "00000000deadbe01";
    }

    # Клиентский traceparent принимаем, только если он синтаксически валиден:
    # мусор в этом заголовке заставляет OTel-SDK начинать новый трейс и молча
    # рвёт связь с логами. sampled-флаг клиента не уважаем (иначе любой бот
    # может включить себе 100% семплинг), решение о семплинге принимает Spring.
    map $http_traceparent $devprep_traceparent {
        "~^00-[0-9a-f]{32}-[0-9a-f]{16}-0[0-9a-f]$" $http_traceparent;
        default "00-$request_id-$devprep_span_id-01";
    }

    # trace_id для access-лога: из клиентского traceparent или наш request_id.
    map $http_traceparent $devprep_trace_id {
        "~^00-(?<tid>[0-9a-f]{32})-[0-9a-f]{16}-0[0-9a-f]$" $tid;
        default $request_id;
    }

    # Content-Security-Policy для публичных статических страниц.
    # 'unsafe-inline' для script-src здесь неизбежен: страницы пререндерены,
    # nginx не умеет выдавать nonce на запрос, а Next.js встраивает инлайновые
    # скрипты гидрации и стриминга плюс наш theme-init-скрипт в <head>.
    # 'unsafe-inline' для style-src нужен из-за инлайновых стилей next/font.
    # /admin и /login эту политику НЕ получают — им CSP с nonce выдаёт
    # frontend/proxy.ts, где на каждый запрос есть свой генератор.
    #
    # img-src: домен хранилища картинок вопросов. Здесь он задаётся явно,
    # потому что nginx.conf монтируется как есть и переменные окружения в нём
    # не раскрываются (в отличие от /admin, где proxy.ts подставляет
    # NEXT_PUBLIC_MEDIA_BASE_URL сам). При переезде на свой поддомен или другой
    # CDN замените адрес ниже, иначе браузер заблокирует картинки на публичных
    # страницах вопросов.
    #
    # googletagmanager/google-analytics разрешены ради Google Analytics 4. Сам
    # скрипт грузится только после согласия пользователя (§ 25 TDDDG) — см.
    # frontend/components/analytics/GoogleAnalytics.tsx. CSP разрешает источник,
    # но не включает аналитику: без согласия запросов к Google нет вовсе.
    # Если GA вам не нужен, уберите эти источники и не задавайте
    # NEXT_PUBLIC_GA_ID.
    map $host $devprep_csp {
        default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pub-026d691fc4174eae84975b10e44eadf5.r2.dev https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests";
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Перезаписываем, а не дополняем: клиентский X-Forwarded-For не должен
    # подделывать IP, по которому бэкенд считает лимиты входа.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    # request-id всегда наш: клиентское значение попало бы в MDC и в логи, а это
    # прямой путь к подделке и раздуванию кардинальности в Loki.
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header traceparent $devprep_traceparent;
    # tracestate пробрасываем как есть: он несёт вендорные данные и на нашей
    # стороне не интерпретируется.
    proxy_set_header tracestate $http_tracestate;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    upstream devprep_api {
        server api:8080;
        keepalive 16;
    }

    upstream devprep_web {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        limit_conn perip 32;

        # ВАЖНО: add_header не наследуется, если в location есть свой add_header.
        # Поэтому набор заголовков продублирован в тех location, которые добавляют
        # собственные (см. /_next/static/ и /admin).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $devprep_csp always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=()" always;
        # Отдаём request-id клиенту: по нему пользователь из поддержки находится
        # в логах одним запросом, без гадания по времени и IP.
        add_header X-Request-Id $request_id always;

        # Служебные файлы никогда не отдаём: .git, .env, бэкапы редакторов.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* \.(env|bak|old|sql|swp|ini|log|zip|tar|gz)$ {
            deny all;
            access_log off;
            return 404;
        }

        # Экзотические методы бэкенду не нужны: отсекаем на периметре.
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # ACME-челлендж Let's Encrypt.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Статика Next.js: иммутабельные хеши — кешируем надолго.
        location /_next/static/ {
            proxy_pass http://devprep_web;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy $devprep_csp always;
        }

        # Вход: жёсткий лимит частоты, burst почти нулевой.
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://devprep_api;
        }

        location = /api/auth/totp/verify {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://devprep_api;
        }

        location = /api/auth/register {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://devprep_api;
        }

        # Смена пароля — тоже точка перебора (нужен текущий пароль), поэтому
        # лимит здесь такой же узкий, как у входа.
        location = /api/auth/password {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://devprep_api;
            add_header Cache-Control "no-store" always;
        }

        # Загрузка картинок из админки — единственная точка, где тело запроса
        # больше двух мегабайт. Запас над MEDIA_MAX_FILE_SIZE (5 МБ) нужен на
        # оверхед multipart: иначе файл ровно в лимит получал бы 413 от nginx
        # вместо понятного ответа бэкенда. Точное совпадение (=) имеет
        # приоритет над префиксом /api/ независимо от порядка блоков.
        location = /api/admin/media {
            limit_req zone=api burst=10 nodelay;
            client_max_body_size 6m;
            proxy_pass http://devprep_api;
            # Загрузка идёт в внешнее хранилище через сеть — даём больше времени,
            # чем обычному API-запросу.
            proxy_read_timeout 120s;
            proxy_request_buffering on;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Request-Id $request_id always;
        }

        # Документация API в интернет не публикуется: включается только
        # локально через SPRINGDOC_ENABLED=true и порт бэкенда напрямую.
        location /api/docs {
            deny all;
            return 404;
        }

        location = /api/openapi.json {
            deny all;
            return 404;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://devprep_api;
            # Ответы API не должны залипать в разделяемых кэшах: в них
            # попадают данные, зависящие от cookie администратора.
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Request-Id $request_id always;
        }

        location /actuator/health {
            proxy_pass http://devprep_api;
            access_log off;
        }

        # Остальной actuator (включая /actuator/prometheus) — только внутри
        # docker-сети: Prometheus ходит на api:8080 напрямую. Метрики раскрывают
        # структуру приложения, объёмы данных и внутренние пути, наружу их не
        # публикуем даже под паролем.
        location /actuator/ {
            deny all;
            return 404;
        }

        # Админка. Раскомментируйте allow/deny, чтобы пустить только офисные адреса.
        # CSP здесь не добавляем: /admin и /login получают строгую политику с nonce
        # от самого Next.js (frontend/proxy.ts). Два заголовка CSP браузер применял
        # бы одновременно, и более слабый server-level вариант только путал бы.
        location /admin {
            # allow 203.0.113.0/24;
            # deny all;
            proxy_pass http://devprep_web;
            proxy_buffering off;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header X-Request-Id $request_id always;
        }

        # Страница входа — тоже с nonce-CSP от Next.js.
        location = /login {
            proxy_pass http://devprep_web;
            proxy_buffering off;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header X-Request-Id $request_id always;
        }

        location / {
            proxy_pass http://devprep_web;
            # Next.js стримит HTML частями: буферизация задерживает закрытие
            # Suspense-границ, и страница залипает на «Загрузка…».
            proxy_buffering off;
        }
    }

    # HTTPS-заготовка: раскомментируйте после выпуска сертификатов
    # (nginx/certs/fullchain.pem и nginx/certs/privkey.pem),
    # затем добавьте в server{listen 80} редирект: return 301 https://$host$request_uri;
    # Без HTTPS cookie с флагом Secure не будут работать — задайте COOKIE_SECURE=false
    # только для локальной разработки.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name devprep.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #     add_header Content-Security-Policy $devprep_csp always;
    #     add_header X-Request-Id $request_id always;
    #
    #     location /_next/static/ { proxy_pass http://devprep_web; add_header Cache-Control "public, max-age=31536000, immutable"; }
    #     location = /api/auth/login { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; }
    #     location = /api/auth/totp/verify { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; }
    #     location = /api/auth/register { limit_req zone=login burst=3 nodelay; proxy_pass http://devprep_api; }
    #     location = /api/admin/media { limit_req zone=api burst=10 nodelay; client_max_body_size 6m; proxy_pass http://devprep_api; proxy_read_timeout 120s; add_header Cache-Control "no-store" always; }
    #     location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://devprep_api; }
    #     location /actuator/health { proxy_pass http://devprep_api; access_log off; }
    #     location /actuator/ { deny all; return 404; }
    #     location /admin { proxy_pass http://devprep_web; proxy_buffering off; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; add_header Cache-Control "no-store" always; }
    #     location = /login { proxy_pass http://devprep_web; proxy_buffering off; add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-store" always; }
    #     location / { proxy_pass http://devprep_web; proxy_buffering off; }
    # }
}
