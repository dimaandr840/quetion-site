# Promtail читает логи контейнеров через docker socket в режиме только-чтение.
# Альтернатива — docker-драйвер loki, но он теряет логи при недоступности Loki
# и ломает docker logs, а также требует установки плагина на хост.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=devprep"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # docker-драйвер оборачивает строку в {"log":...}; сначала снимаем его.
      - docker: {}
      # Затем разбираем наш JSON из logback-spring.xml / pino.
      - json:
          expressions:
            level: level
            logger: logger
            requestId: requestId
            userId: userId
            traceId: traceId
            spanId: spanId
      # Метки — только низкокардинальные поля.
      - labels:
          level:
      # request-id и trace-id — в structured metadata: по ним можно фильтровать
      # без раздувания индекса потоков.
      - structured_metadata:
          requestId:
          traceId:
          spanId:
          userId:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: fudge

  # nginx пишет access.log тем же JSON-форматом (см. nginx/nginx.conf),
  # поэтому на периметре тоже есть request_id для сквозного поиска.
  - job_name: nginx-access
    static_configs:
      - targets: ["localhost"]
        labels:
          service: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            requestId: request_id
            status: status
      - labels:
          status:
      - structured_metadata:
          requestId:
