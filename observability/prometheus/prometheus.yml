# Prometheus живёт во внутренней сети: наружу порт не публикуется, метрики
# Actuator рассказывают о структуре и нагрузке сервиса и в интернет не идут.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  # Правила SLO считаются на том же интервале: реже — алерт опаздывает,
  # чаще — растёт нагрузка на ряды без выигрыша в точности.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Spring Boot Actuator. Путь /actuator/prometheus открыт только внутри
  # docker-сети: nginx отдаёт на него 404 (см. nginx/nginx.conf).
  - job_name: devprep-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # Next.js отдаёт метрики процесса на отдельном порту (см. frontend/instrumentation.ts).
  - job_name: devprep-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:9464"]
        labels:
          service: web

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
