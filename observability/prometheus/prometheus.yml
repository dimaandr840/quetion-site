# Prometheus живёт во внутренней сети: наружу порт не публикуется, метрики
# Actuator рассказывают о структуре и нагрузке сервиса и в интернет не идут.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  # Правила SLO считаются на том же интервале: реже — алерт опаздывает,
  # чаще — растёт нагрузка на ряды без выигрыша в точности.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Spring Boot Actuator. Путь /actuator/prometheus открыт только внутри
  # docker-сети: nginx отдаёт на него 404 (см. nginx/nginx.conf).
  - job_name: devprep-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # Next.js отдаёт метрики процесса на отдельном порту (см. frontend/instrumentation.ts).
  - job_name: devprep-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:9464"]
        labels:
          service: web

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]

  # Нагрузка хоста: CPU, load average, RAM, swap, диск, сеть.
  # Метка host нужна, чтобы при переезде на второй VPS не переписывать алерты.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: vps

  # Нагрузка по контейнерам — чтобы отличить «сервер перегружен» от
  # «один контейнер течёт по памяти».
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Доступность. Цель передаётся blackbox'у параметром target, поэтому
  # __address__ подменяется в relabel_configs на адрес самого экспортёра.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # Внутренние пробы через nginx: те же три адреса, по которым
      # scripts/deploy-release.sh решает, удался ли релиз.
      - targets:
          - http://nginx/api/actuator/health
          - http://nginx/
          - http://nginx/search
        labels:
          probe: internal

  # Публичная проба: проверяет DNS, внешний firewall и TLS целиком.
  # При смене домена правится только этот блок.
  - job_name: blackbox-http-public
    metrics_path: /probe
    params:
      module: [http_2xx_public]
    scrape_interval: 60s
    static_configs:
      - targets:
          - https://qareerquest.com/
        labels:
          probe: public

# relabel для обоих blackbox-джобов задаётся ниже через YAML-анкоры нельзя
# (Prometheus читает строгую схему), поэтому он дублируется выше в каждом джобе.
