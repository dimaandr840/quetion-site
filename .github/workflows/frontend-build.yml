name: frontend build

# Докер-сборка падала на ошибке типизации, которую никто не видел до деплоя.
# Эта проверка запускает ровно ту же команду, что и frontend/Dockerfile,
# но на каждом PR.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

# Новый пуш в ту же ветку отменяет предыдущий прогон: незачем ждать сборку
# кода, который уже переписан.
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: npm run build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Значения повторяют frontend/Dockerfile. Если они разойдутся, CI начнёт
      # проходить там, где докер падает, и проверка потеряет смысл.
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_AUTH_ENABLED: "true"
      NEXT_PUBLIC_SITE_URL: "http://localhost"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # node:24-alpine в Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, а не npm install: ставим ровно то, что в package-lock.json,
      # иначе CI может собрать сборку на других версиях зависимостей.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # next build включает проверку типов и ESLint-правила Next, поэтому
      # отдельный шаг tsc не нужен: TS2352 из докер-лога ловится здесь.
      - name: Build
        run: npm run build
