name: Repair lockfile on isolated remediation branch
on:
  push:
    branches: [fix/production-reliability-2026-09-07]
    paths: [.github/workflows/repair-lockfile.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-reliability-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate lockfile without lifecycle scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile to this branch
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize frontend lockfile for reproducible installs'
          git fetch origin fix/production-reliability-2026-09-07
          git rebase origin/fix/production-reliability-2026-09-07
          git push origin HEAD:fix/production-reliability-2026-09-07
