name: Deploy — LuxVPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег образа для отката (short SHA). Пусто — собрать текущий коммит.'
        required: false
        default: ''

# Два деплоя одновременно на один VPS — гарантированный разъезжающийся state,
# поэтому очередь, а не отмена предыдущего запуска.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      api_image: ${{ steps.vars.outputs.api_image }}
      web_image: ${{ steps.vars.outputs.web_image }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: vars
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${{ github.repository }}/api:$TAG" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${{ github.repository }}/web:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.api_image }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # NEXT_PUBLIC_* вшиваются в клиентский бандл на этапе сборки, поэтому
      # значения берём из Repository variables, а не из .env на сервере.
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_AUTH_ENABLED=${{ vars.AUTH_ENABLED || 'true' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.MEDIA_PUBLIC_BASE_URL }}
          tags: |
            ${{ steps.vars.outputs.web_image }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to LuxVPS
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LUXVPS_HOST }}
          username: ${{ secrets.LUXVPS_USER || secrets.LUXVPS_ROOT_USER || 'root' }}
          password: ${{ secrets.LUXVPS_SSH_PASSWORD || secrets.LUXVPS_ROOT_PASSWORD }}
          key: ${{ secrets.LUXVPS_SSH_KEY }}
          port: ${{ secrets.LUXVPS_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          envs: DEPLOY_PATH,GIT_SHA,API_IMAGE,WEB_IMAGE,GHCR_USER,GHCR_TOKEN,HEALTH_URL
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            # Конфиги nginx и compose-файлы монтируются с диска, поэтому репозиторий
            # на сервере должен соответствовать выкатываемому коммиту.
            git fetch --prune origin
            git reset --hard "$GIT_SHA"

            # Генерируем nginx.effective.conf: git reset его не восстанавливает,
            # файл не версионируется.
            bash scripts/render-nginx-conf.sh

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export API_IMAGE WEB_IMAGE
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.images.yml"

            # Запоминаем текущие образы для автоотката.
            PREV_API="$(docker inspect --format='{{.Config.Image}}' devprep-api-1 2>/dev/null || true)"
            PREV_WEB="$(docker inspect --format='{{.Config.Image}}' devprep-web-1 2>/dev/null || true)"

            $COMPOSE pull api web
            $COMPOSE up -d --remove-orphans

            # Liquibase-миграции и старт JVM занимают время — ждём здоровья API.
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 "$HEALTH_URL" >/dev/null; then ok=1; break; fi
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              echo "::error::Health check не прошёл, откатываемся"
              $COMPOSE logs --tail=200 api web || true
              if [ -n "$PREV_API" ] && [ -n "$PREV_WEB" ]; then
                API_IMAGE="$PREV_API" WEB_IMAGE="$PREV_WEB" $COMPOSE up -d
                echo "Откат на $PREV_API / $PREV_WEB выполнен"
              fi
              exit 1
            fi

            $COMPOSE ps
            docker image prune -f
            docker logout ghcr.io || true
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/quetion-site' }}
          GIT_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-push.outputs.web_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1/api/actuator/health' }}
