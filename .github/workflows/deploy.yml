name: Deploy — LuxVPS

# Деплой запускается ТОЛЬКО вручную. Автозапуск по завершению CI намеренно
# убран: пуш в main не должен уезжать в прод сам по себе.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Что выложить: ветка, тег или commit SHA. По умолчанию main. Код пересобирается.'
        required: false
        default: main
        type: string
      image_tag:
        description: 'Откат на ранее записанный релиз: полный commit SHA (40 символов). Если заполнено, git_ref игнорируется и код НЕ пересобирается.'
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      rollback: ${{ steps.release.outputs.rollback }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_REF: ${{ inputs.git_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Режим откката: сборки нет, берём ровно тот SHA, для которого на
          # сервере записан файл .releases/<sha> с дайджестами образов.
          if [ -n "${IMAGE_TAG:-}" ]; then
            [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
              echo '::error::image_tag должен быть полным commit SHA (40 hex-символов).'
              exit 2
            }
            echo "sha=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            echo 'rollback=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Обычный деплой: ветку/тег разыменовываем в полный SHA. Короткий SHA
          # или имя ветки дальше не годятся — deploy-release.sh требует 40 hex,
          # чтобы релиз был воспроизводим и откат ссылался на конкретный коммит.
          REF=${GIT_REF:-main}
          SHA=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Не удалось определить commit SHA для '$REF'."
            exit 2
          }
          echo "Выкладываем $REF -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo 'rollback=false' >> "$GITHUB_OUTPUT"

  build-push:
    needs: resolve
    if: needs.resolve.outputs.rollback != 'true'
    runs-on: ubuntu-latest
    # Тот же environment, что и у deploy: NEXT_PUBLIC_* берутся из vars.*,
    # а переменные environment недоступны job'ам без environment — без этой
    # строки фронтенд собирался бы с пустым SITE_URL, даже если переменные заданы.
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ghcr.io/${{ github.repository }}/api@${{ steps.api.outputs.digest }}
      web_image: ghcr.io/${{ github.repository }}/web@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Проверить обязательные переменные сборки
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          if [ -z "$PUBLIC_ORIGIN" ]; then
            echo '::error::Не задана переменная PUBLIC_ORIGIN (например https://qareerquest.com).'
            echo '::error::Задай её в Settings → Environments → production → Environment variables.'
            exit 2
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build api
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ needs.resolve.outputs.sha }}
          # NEXT_PUBLIC_YM_ID — номер счётчика Яндекс Метрики. Пустое значение =
          # счётчик не подключается вовсе (см. frontend/components/analytics/YandexMetrika.tsx).
          build-args: |
            NEXT_PUBLIC_AUTH_ENABLED=${{ vars.AUTH_ENABLED || 'true' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.MEDIA_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_YM_ID=${{ vars.YANDEX_METRIKA_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [resolve, build-push]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.rollback == 'true' || needs.build-push.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - name: Deploy recorded release over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LUXVPS_HOST }}
          username: ${{ secrets.LUXVPS_USER || secrets.LUXVPS_ROOT_USER || 'root' }}
          password: ${{ secrets.LUXVPS_SSH_PASSWORD || secrets.LUXVPS_ROOT_PASSWORD }}
          key: ${{ secrets.LUXVPS_SSH_KEY }}
          port: ${{ secrets.LUXVPS_PORT || 22 }}
          command_timeout: 25m
          envs: DEPLOY_PATH,GIT_SHA,DEPLOY_SCRIPT_SHA,API_IMAGE,WEB_IMAGE,ROLLBACK,GHCR_USER,GHCR_TOKEN,HEALTH_ORIGIN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            runner=$(mktemp)
            trap 'rm -f "$runner"; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            git show "$DEPLOY_SCRIPT_SHA:scripts/deploy-release.sh" > "$runner"
            chmod 700 "$runner"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            bash "$runner"
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/quetion-site' }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_SCRIPT_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-push.outputs.web_image }}
          ROLLBACK: ${{ needs.resolve.outputs.rollback }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          HEALTH_ORIGIN: ${{ vars.HEALTH_ORIGIN || 'http://127.0.0.1' }}
