name: Deploy — LuxVPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег образа для отката (short SHA). Пусто — собрать текущий коммит.'
        required: false
        default: ''

# Два деплоя одновременно на один VPS — гарантированный разъезжающийся state,
# поэтому очередь, а не отмена предыдущего запуска.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Гейт: тесты и сборка образов из ci.yml выполняются до пуша в GHCR.
  # Без этого push в main запускал deploy и CI параллельно, и в прод мог уехать
  # коммит с падающими тестами.
  ci:
    name: CI gate
    # Ручной откат на уже собранный тег ничего не пересобирает — гонять тесты
    # заново не нужно, важнее скорость возврата на рабочую версию.
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      api_image: ${{ steps.vars.outputs.api_image }}
      web_image: ${{ steps.vars.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="$INPUT_IMAGE_TAG"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${{ github.repository }}/api:$TAG" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${{ github.repository }}/web:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.api_image }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # NEXT_PUBLIC_* вшиваются в клиентский бандл на этапе сборки, поэтому
      # значения берём из Repository variables, а не из .env на сервере.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_AUTH_ENABLED=${{ vars.AUTH_ENABLED || 'true' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.MEDIA_PUBLIC_BASE_URL }}
          tags: |
            ${{ steps.vars.outputs.web_image }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to LuxVPS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-push
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LUXVPS_HOST }}
          username: ${{ secrets.LUXVPS_USER || secrets.LUXVPS_ROOT_USER || 'root' }}
          password: ${{ secrets.LUXVPS_SSH_PASSWORD || secrets.LUXVPS_ROOT_PASSWORD }}
          key: ${{ secrets.LUXVPS_SSH_KEY }}
          port: ${{ secrets.LUXVPS_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          envs: DEPLOY_PATH,GIT_SHA,API_IMAGE,WEB_IMAGE,GHCR_USER,GHCR_TOKEN,HEALTH_URL,WEB_HEALTH_URL,SKIP_DB_BACKUP
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            # Конфиги nginx и compose-файлы монтируются с диска, поэтому репозиторий
            # на сервере должен соответствовать выкатываемому коммиту.
            git fetch --prune origin
            git reset --hard "$GIT_SHA"

            # Генерируем nginx.effective.conf: git reset его не восстанавливает,
            # файл не версионируется.
            bash scripts/render-nginx-conf.sh

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export API_IMAGE WEB_IMAGE
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.images.yml"

            # Бэкап до миграций, а не после: автооткат возвращает предыдущие образы,
            # но Liquibase уже успел изменить схему, и без дампа откатывать нечего.
            if [ "${SKIP_DB_BACKUP:-false}" = "true" ]; then
              echo "Бэкап пропущен по SKIP_DB_BACKUP=true"
            elif bash scripts/backup-db.sh; then
              echo "Дамп БД снят"
            else
              echo "::warning::Бэкап БД не удался — выкат продолжается, но откат схемы будет невозможен"
            fi

            # Предыдущие образы для автоотката. Имена контейнеров не хардкодим:
            # они зависят от имени проекта и схемы нумерации compose.
            prev_image() {
              cid="$($COMPOSE ps -q "$1" 2>/dev/null || true)"
              [ -n "$cid" ] || return 0
              docker inspect --format='{{.Config.Image}}' "$cid" 2>/dev/null || true
            }

            PREV_API="$(prev_image api)"
            PREV_WEB="$(prev_image web)"

            $COMPOSE pull api web
            $COMPOSE up -d --remove-orphans

            # Liquibase-миграции и старт JVM занимают время — ждём здоровья.
            wait_ok() {
              url="$1"
              name="$2"
              for _ in $(seq 1 60); do
                if curl -fsS --max-time 5 -o /dev/null "$url"; then
                  echo "$name отвечает"
                  return 0
                fi
                sleep 5
              done
              echo "::error::$name не ответил за 5 минут ($url)"
              return 1
            }

            # Проверяем и API, и web: раньше лежащий Next.js считался успешным выкатом,
            # потому что actuator отвечал.
            ok=1
            wait_ok "$HEALTH_URL" "API" || ok=0
            if [ "$ok" -eq 1 ]; then
              wait_ok "$WEB_HEALTH_URL" "Web" || ok=0
            fi

            if [ "$ok" -ne 1 ]; then
              echo "::error::Health check не прошёл, откатываемся"
              $COMPOSE logs --tail=200 api web || true
              if [ -n "$PREV_API" ] && [ -n "$PREV_WEB" ]; then
                API_IMAGE="$PREV_API" WEB_IMAGE="$PREV_WEB" $COMPOSE up -d
                echo "Откат на $PREV_API / $PREV_WEB выполнен"
              else
                echo "::warning::Предыдущие образы не определены (PREV_API='$PREV_API', PREV_WEB='$PREV_WEB') — автооткат невозможен, нужен ручной запуск с рабочим image_tag"
              fi
              exit 1
            fi

            $COMPOSE ps
            docker image prune -f
            docker logout ghcr.io || true
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/quetion-site' }}
          GIT_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-push.outputs.web_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1/api/actuator/health' }}
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL || 'http://127.0.0.1/' }}
          SKIP_DB_BACKUP: ${{ vars.SKIP_DB_BACKUP || 'false' }}

      # Локальный health check не видит проблем с DNS, TLS и firewall,
      # поэтому после выката дёргаем сайт снаружи.
      - name: Внешний smoke-тест
        if: vars.PUBLIC_ORIGIN != ''
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$PUBLIC_ORIGIN" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "$PUBLIC_ORIGIN отвечает 200"
              exit 0
            fi
            echo "попытка $i: код $code"
            sleep 10
          done
          echo "::error::$PUBLIC_ORIGIN недоступен снаружи после успешного локального health check"
          exit 1

      - name: Итог в summary
        if: always()
        run: |
          {
            echo "### Деплой ${{ needs.build-push.outputs.tag }}"
            echo ""
            echo "- api: \`${{ needs.build-push.outputs.api_image }}\`"
            echo "- web: \`${{ needs.build-push.outputs.web_image }}\`"
            echo "- результат: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
