name: Deploy — LuxVPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Откат на ранее записанный релиз: полный commit SHA (40 символов). Не пересобирает код.'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.image_tag }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected full commit SHA'; exit 2; }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  build-push:
    needs: resolve
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ghcr.io/${{ github.repository }}/api@${{ steps.api.outputs.digest }}
      web_image: ghcr.io/${{ github.repository }}/web@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build api
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ needs.resolve.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_AUTH_ENABLED=${{ vars.AUTH_ENABLED || 'true' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.MEDIA_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.GA_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [resolve, build-push]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.build-push.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - name: Deploy recorded release over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LUXVPS_HOST }}
          username: ${{ secrets.LUXVPS_USER || secrets.LUXVPS_ROOT_USER || 'root' }}
          password: ${{ secrets.LUXVPS_SSH_PASSWORD || secrets.LUXVPS_ROOT_PASSWORD }}
          key: ${{ secrets.LUXVPS_SSH_KEY }}
          port: ${{ secrets.LUXVPS_PORT || 22 }}
          command_timeout: 25m
          envs: DEPLOY_PATH,GIT_SHA,DEPLOY_SCRIPT_SHA,API_IMAGE,WEB_IMAGE,ROLLBACK,GHCR_USER,GHCR_TOKEN,HEALTH_ORIGIN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            runner=$(mktemp)
            trap 'rm -f "$runner"; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            git show "$DEPLOY_SCRIPT_SHA:scripts/deploy-release.sh" > "$runner"
            chmod 700 "$runner"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            bash "$runner"
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/quetion-site' }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_SCRIPT_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-push.outputs.web_image }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          HEALTH_ORIGIN: ${{ vars.HEALTH_ORIGIN || 'http://127.0.0.1' }}
