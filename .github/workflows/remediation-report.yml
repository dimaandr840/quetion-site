# One-shot verification, second pass after fixes; removed before review.
name: Record remediation verification
on:
  push:
    branches: [fix/production-reliability-2026-09-07]
    paths: [.github/workflows/remediation-report.yml]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-reliability-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Record check results without production credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: python3 scripts/verify-remediation.py
      - name: Commit only the verification report to the isolated branch
        run: |
          git add docs/remediation-verification.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: record executed remediation verification results'
          git fetch origin fix/production-reliability-2026-09-07
          git rebase origin/fix/production-reliability-2026-09-07
          git push origin HEAD:fix/production-reliability-2026-09-07
