name: CI

# Триггера на push в main здесь нет намеренно: на main этот же workflow
# вызывается из deploy.yml через workflow_call и служит гейтом деплоя.
# Иначе один и тот же коммит проверялся бы дважды.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Отменяем только прогоны на PR. На main прогон — гейт деплоя,
  # и его отмена сняла бы защиту от выката непротестированного кода.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend — mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # TODO(lockfile): вернуть `npm ci`. npm ci требует лок, синхронный с
      # package.json, а в репо он отстаёт (нет @opentelemetry/api, @vercel/otel,
      # prom-client). Пока стоит npm install, сборки CI и прода не гарантированно
      # идентичны — это единственное оставшееся отступление от воспроизводимости.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck

      - name: Design tokens check
        run: npm run check:tokens

      - name: Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker image — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Образ собирается независимо от тестов: падение теста не должно скрывать
    # поломку Dockerfile, а фидбэк приходит параллельно.
    strategy:
      fail-fast: false
      matrix:
        include:
          # service совпадает с именем образа в GHCR и с cache-scope в deploy.yml,
          # поэтому деплой после мержа переиспользует кэш этой сборки.
          - service: api
            context: backend
          - service: web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: false
          load: true
          tags: quetion-site-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Отчёт по всему, что нашлось: HIGH не валит сборку, потому что в базовых
      # образах он появляется быстрее, чем выходят патчи.
      - name: Trivy — отчёт (HIGH, CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --no-progress \
              --exit-code 0 \
              "quetion-site-${{ matrix.service }}:ci"

      # А вот CRITICAL, для которого уже есть исправленная версия пакета, —
      # это блокер: обновиться нечего мешает.
      - name: Trivy — гейт (CRITICAL с доступным фиксом)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --no-progress \
              --exit-code 1 \
              "quetion-site-${{ matrix.service }}:ci"
