# Конфиг pgBackRest. Здесь только то, что не зависит от окружения и не является секретом.
# Бакет, эндпоинт, ключи и пароль шифрования приезжают через переменные
# PGBACKREST_* из .env — так секреты не лежат в git и не попадают в образ.

[global]
repo1-type=s3
repo1-path=/pgbackrest
# path-style URI: так работают R2, MinIO и большинство S3-совместимых шлюзов.
# Для настоящего AWS S3 поставьте host вместо endpoint и uri-style=host.
repo1-s3-uri-style=path

# Шифруем до отправки: провайдер и его сотрудники видят только шифротекст.
# Без repo1-cipher-pass репозиторий невосстановим — храните пароль отдельно от сервера.
repo1-cipher-type=aes-256-cbc

# GFS-ретеншен: 4 полных бэкапа (при недельном полном — окно PITR месяц).
# WAL удаляются вместе с бэкапами, под которые они были нужны.
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=14

# bundle/block заметно сокращают число запросов к S3 и размер инкрементов:
# мелкие файлы склеиваются, большие копируются блоками, а не целиком.
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=6
process-max=2

# Асинхронный archive-push: PostgreSQL отдаёт WAL в spool и не ждёт сети,
# иначе каждый сетевой таймаут тормозит запись в базу.
archive-async=y
spool-path=/var/spool/pgbackrest

# archive-push-queue-max сознательно НЕ выставлен: он при переполнении начинает
# молча выбрасывать WAL, то есть рвёт непрерывность PITR ради свободного места.
# Мы вместо этого алертим по размеру pg_wal (scripts/pgbackrest-health.sh).

# start-fast: не ждать естественного чекпоинта перед началом бэкапа.
start-fast=y

log-level-console=info
log-level-file=info
log-path=/var/log/pgbackrest

[devprep]
pg1-path=/var/lib/postgresql/data
# Подключение к БД через unix-сокет, который шарится с сайдкаром через
# volume postgres-socket.
pg1-socket-path=/var/run/postgresql
pg1-port=5432
