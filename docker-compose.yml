name: devprep

# Общие правила усиления для всех сервисов:
#  * no-new-privileges закрывает путь к эскалации через setuid-бинарфайлы
#    внутри образа, если RCE вс႑-таки случилась;
#  * база и поиск порты наружу не публикуют вообще — только nginx смотрит в сеть;
#  * размер логов ограничен, чтобы шумные атаки не забили диск хоста.
#
# Локальный json-file остаётся буфером последней надежды: Promtail читает именно его,
# поэтому замена драйвера на loki сделала бы логи недоступными в момент, когда они нужнее всего —
# когда лежит сам Loki.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devprep}
      POSTGRES_USER: ${POSTGRES_USER:-devprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devprep} -d ${POSTGRES_DB:-devprep}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  meilisearch:
    <<: *hardening
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      # 127.0.0.1, а не localhost: Meilisearch слушает только IPv4, а wget внутри
      # контейнера сначала пробует ::1 и получает connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *hardening
    # JVM пишет только в /tmp, поэтому остальная ФС контейнера может быть только для чтения:
    # закрепиться в контейнере и подменить файлы приложения уже не получится.
    # Картинки лежат во внешнем объектном хранилище, так что том для медиа не нужен
    # и read_only можно было сохранить.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-devprep}
      POSTGRES_USER: ${POSTGRES_USER:-devprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MEILI_ENABLED: ${MEILI_ENABLED:-true}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # Жёсткий потолок Meilisearch на глубину выдачи. Запросы глубже этого значения
      # уходят в Postgres, а не обрезаются молча посреди пагинации.
      MEILI_MAX_TOTAL_HITS: ${MEILI_MAX_TOTAL_HITS:-1000}
      SEARCH_PAGE_SIZE: ${SEARCH_PAGE_SIZE:-20}
      SEARCH_MAX_PAGE_SIZE: ${SEARCH_MAX_PAGE_SIZE:-50}
      SEARCH_HEALTH_INTERVAL: ${SEARCH_HEALTH_INTERVAL:-PT30S}
      # Фичефлаги живут в БД; значения ниже — только стартовые defaults для первого
      # запуска и аварийного режима, когда таблица недоступна. См. docs/feature-flags.md.
      FLAGS_ENABLED: ${FLAGS_ENABLED:-true}
      FLAGS_CACHE_TTL: ${FLAGS_CACHE_TTL:-PT15S}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      # Загрузка картинок. Без MEDIA_ENABLED=true сервис работает как раньше,
      # а админка показывает ошибку при попытке загрузить файл. См. docs/media.md.
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
      # https://<account_id>.r2.cloudflarestorage.com — служебный эндпоинт S3 API,
      # не публичный домен бакета.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      # Ключи видит только бэкенд: в браузер они не попадают ни в каком виде.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_MAX_FILE_SIZE: ${MEDIA_MAX_FILE_SIZE:-5MB}
      # false открывает /api/admin/** без входа — только для разработки.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Secure-cookie требует HTTPS. По умолчанию включён; для локального
      # запуска по http нужно выставить COOKIE_SECURE=false в .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      LOCKOUT_ENABLED: ${LOCKOUT_ENABLED:-true}
      LOCKOUT_MAX_ATTEMPTS: ${LOCKOUT_MAX_ATTEMPTS:-5}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-PT15M}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-PT10M}
      TOTP_REQUIRED_FOR_ADMINS: ${TOTP_REQUIRED_FOR_ADMINS:-true}
      # Без ключа TOTP-секреты легли бы в БД открытым текстом, поэтому переменная обязательна.
      TOTP_ENC_KEY: "${TOTP_ENC_KEY:?TOTP_ENC_KEY обязателен, см. openssl rand -base64 32}"
      # SMTP для писем с кодом восстановления доступа. Если SMTP_HOST или
      # PASSWORD_RESET_MAIL_FROM пусты, сервис запускается, но письма не уходят —
      # теперь это видно в /api/admin/status и в метрике devprep_mail_up.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-true}
      PASSWORD_RESET_MAIL_FROM: ${PASSWORD_RESET_MAIL_FROM:-}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-PT15M}
      PASSWORD_RESET_COOLDOWN: ${PASSWORD_RESET_COOLDOWN:-PT1M}
      PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_RESET_TOTP: ${PASSWORD_RESET_RESET_TOTP:-true}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      # prometheus в списке по умолчанию: наружу эндпоинт вс႑ равно не выходит —
      # nginx отдаёт 404 на весь /actuator/, кроме /actuator/health.
      MANAGEMENT_ENDPOINTS: ${MANAGEMENT_ENDPOINTS:-health,info,prometheus}
      # 10% трейсов — компромисс между объᄅмом данных и шансом поймать редкий тормоз.
      # На время разбора инцидента ставьте 1.0.
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *hardening
    # Next.js пишет в .next/cache на рантайме (ISR, оптимизация картинок),
    # поэтому read_only здесь не включаем — только сбрасываем capabilities.
    cap_drop:
      - ALL
    build:
      context: ./frontend
      args:
        # Значение по умолчанию для первого рендера и для proxy.ts, который работает
        # до гидратации. Фактическое состояние флагов приходит из /api/flags в рантайме,
        # пересборка ради переключения больше не нужна.
        NEXT_PUBLIC_AUTH_ENABLED: ${AUTH_ENABLED:-true}
        # Абсолютный origin нужен robots.txt и sitemap.xml.
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:-http://localhost}
        # Домен хранилища попадает в images.remotePatterns и в img-src CSP,
        # а оба списка вычисляются на сборке — отсюда build arg.
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost}/api
      NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      API_INTERNAL_BASE_URL: http://api:8080/api
      # Серверная часть Next участвует в том же трейсе, что nginx и Spring:
      # без этого звена «медленно на странице вопроса» не разбирается на слагаемые.
      OTEL_SERVICE_NAME: devprep-web
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${TRACING_SAMPLE_RATE:-0.1}
      # Порт с метриками Next для Prometheus (job devprep-web). Наружу не публикуется.
      METRICS_PORT: "9464"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    # Конфиг и сертификаты примонтированы :ro, а рабочие каталоги — tmpfs,
    # так что веб-сервер на периметре работает без записи на диск.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  meili-data:
